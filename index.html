<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="食品の賞味期限をかんたんに管理できるページ" />
    <title>食品の賞味期限管理</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-labelledby="page-title">
        <header class="page-header">
          <p class="eyebrow">食品リスト</p>
          <h1 id="page-title">食品の賞味期限管理</h1>
          <p>商品と賞味期限を登録して、残り日数をかんたんに確認できます。</p>
        </header>

        <form id="food-form" class="food-form">
          <div class="scan-row">
            <button id="scan-button" class="scan-button" type="button">バーコードを読み取る</button>
            <p id="scan-status" class="scan-status" role="status" aria-live="polite">
              カメラで商品バーコードを読み取ると、商品名が自動入力されます。
            </p>
          </div>

          <div id="scanner" class="scanner" hidden>
            <video id="camera-preview" playsinline muted aria-label="バーコード読み取り用カメラ"></video>
            <div class="scan-guide" aria-hidden="true"></div>
            <button id="stop-scan-button" class="stop-scan-button" type="button">読み取りを中止する</button>
          </div>

          <div class="field">
            <label for="product-name">商品名</label>
            <input
              id="product-name"
              name="productName"
              type="text"
              placeholder="例：牛乳"
              autocomplete="off"
              required
            />
          </div>

          <div class="field">
            <label for="expiry-date">賞味期限</label>
            <input id="expiry-date" name="expiryDate" type="date" required />
          </div>

          <button type="submit">保存する</button>
        </form>

        <section class="saved-section" aria-labelledby="saved-title">
          <div class="section-heading">
            <h2 id="saved-title">登録済みの商品</h2>
            <span id="item-count" aria-live="polite">0件</span>
          </div>
          <p id="empty-state" class="empty-state">商品はまだ登録されていません。上のフォームから追加してください。</p>
          <ul id="food-list" class="food-list" aria-live="polite"></ul>
        </section>
      </section>
    </main>

    <script src="https://unpkg.com/@zxing/browser@0.1.5"></script>
    <script src="script.js?v=20260815-5"></script>
  </body>
</html>
